<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="description" content="ABC Credit loan application assistant">
  <title>ABC Credit · Application assistant</title>
  <link rel="stylesheet" href="/static/styles.css?v=answer-review">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ABC Credit home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">abc<span>credit</span></span>
      </a>
      <div class="topbar-right"><span class="secure-dot"></span><span>Application assessment</span></div>
    </header>

    <main class="layout">
      <section class="assistant-card" aria-label="Application assistant">
        <div class="card-head">
          <div class="assistant-avatar" aria-hidden="true"><span class="avatar-spark">✦</span></div>
          <div class="assistant-heading"><strong>ABC application assistant</strong><span><i></i>Ready to assist</span></div>
          <button class="restart-button" id="restart" type="button" title="Start over" aria-label="Start over">↻</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-label"><span id="step-label">Ready when you are</span><span id="step-count">0 / 11</span></div>
          <div class="progress-track"><div id="progress-fill"></div></div>
        </div>
        <div class="model-note">Quick answers · no name, phone number, or exact address required</div>
        <div id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div id="composer" class="composer"></div>
        <div class="card-foot"><span class="foot-lock">⌑</span> Your answers and assessment are recorded without direct identifiers.</div>
      </section>
    </main>
    <footer class="page-footer"><span>ABC Credit application assistant</span><span>Loan application assessment</span></footer>
  </div>
  <script src="/static/app.js?v=answer-review" defer></script>
</body>
</html>
